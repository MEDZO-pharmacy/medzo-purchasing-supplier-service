name: Test and Deploy Purchasing Supplier Service

on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/build-ghcr.yml'
      - 'docker/**'
      - 'docs/deployment.md'
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Medzo.PurchasingSupplier.sln'
      - 'dotnet-tools.json'
  workflow_dispatch:

concurrency:
  group: medzo-purchasing-supplier-ghcr
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/medzo-pharmacy/medzo-purchasing-supplier-service
  CONTAINER_APP_NAME: medzo-purchasing-service
  CONTAINER_APP_ENVIRONMENT: medzo-env-01
  RESOURCE_GROUP: rg-MEDZO-NEW

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and test
        run: |
          dotnet restore Medzo.PurchasingSupplier.sln
          dotnet test Medzo.PurchasingSupplier.sln --configuration Release --no-restore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Validate Azure OpenID Connect variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?Add repository Actions variable AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Add repository Actions variable AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Add repository Actions variable AZURE_SUBSCRIPTION_ID}"

      - name: Log in to Azure using OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate existing Azure resources and configuration
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            app_json=$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --output json)

            environment_id=$(jq -r '.properties.environmentId' <<< "$app_json")
            [[ "$environment_id" == */${{ env.CONTAINER_APP_ENVIRONMENT }} ]] || {
              echo "Existing app is not in ${{ env.CONTAINER_APP_ENVIRONMENT }}" >&2
              exit 1
            }

            jq -e '.properties.template.containers[0].env[] | select(.name == "ConnectionStrings__PurchasingSupplier" and .secretRef != null)' <<< "$app_json" >/dev/null || {
              echo "Existing app is missing the PurchasingSupplier SQL secret reference." >&2
              exit 1
            }
            jq -e '.properties.template.containers[0].env[] | select(.name == "Jwt__Secret" and .secretRef != null)' <<< "$app_json" >/dev/null || {
              echo "Existing app is missing the JWT secret reference." >&2
              exit 1
            }

      - name: Deploy image to existing Purchasing Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az containerapp update \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --container-name medzo-purchasing-service \
              --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --cpu 0.5 --memory 1Gi \
              --min-replicas 0 --max-replicas 1 \
              --set-env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                Database__Provider=SqlServer \
                Database__MigrateOnStartup=true \
                Jwt__Issuer=MedzoAuthService \
                Jwt__Audience=MedzoClient \
                Kafka__Enabled=false \
                Cors__AllowedOrigins__0=https://brave-forest-045498500.3.azurestaticapps.net \
              --output none

      - name: Configure Kafka sidecar in the existing Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            app_id=$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query id \
              --output tsv)

            az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --output json |
              jq --arg app_image "${{ env.IMAGE_NAME }}:${{ github.sha }}" '
                .properties.template.containers |= (
                  map(select(.name != "medzo-kafka")) +
                  [{
                    name: "medzo-kafka",
                    image: "docker.io/apache/kafka:3.9.0",
                    resources: { cpu: 0.5, memory: "1Gi" },
                    env: [
                      { name: "KAFKA_NODE_ID", value: "1" },
                      { name: "KAFKA_PROCESS_ROLES", value: "broker,controller" },
                      { name: "KAFKA_LISTENERS", value: "PLAINTEXT://:9092,CONTROLLER://:9093" },
                      { name: "KAFKA_ADVERTISED_LISTENERS", value: "PLAINTEXT://localhost:9092" },
                      { name: "KAFKA_CONTROLLER_LISTENER_NAMES", value: "CONTROLLER" },
                      { name: "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP", value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" },
                      { name: "KAFKA_CONTROLLER_QUORUM_VOTERS", value: "1@localhost:9093" },
                      { name: "KAFKA_INTER_BROKER_LISTENER_NAME", value: "PLAINTEXT" },
                      { name: "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR", value: "1" },
                      { name: "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR", value: "1" },
                      { name: "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR", value: "1" },
                      { name: "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS", value: "0" },
                      { name: "KAFKA_AUTO_CREATE_TOPICS_ENABLE", value: "true" },
                      { name: "KAFKA_HEAP_OPTS", value: "-Xms128m -Xmx256m" },
                      { name: "CLUSTER_ID", value: "MkU3OEVBNTcwNTJENDM2Qk" },
                      { name: "KAFKA_LOG_DIRS", value: "/tmp/kraft-combined-logs" }
                    ]
                  }]
                ) |
                (.properties.template.containers[] | select(.name == "medzo-purchasing-service").image) = $app_image |
                (.properties.template.containers[] | select(.name == "medzo-purchasing-service").env) |= (
                  map(select(.name != "Kafka__Enabled" and .name != "Kafka__BootstrapServers")) +
                  [
                    { name: "Kafka__Enabled", value: "true" },
                    { name: "Kafka__BootstrapServers", value: "localhost:9092" }
                  ]
                ) |
                { properties: { template: .properties.template } }
              ' > containerapp-kafka-patch.json

            az rest \
              --method patch \
              --url "https://management.azure.com${app_id}?api-version=2024-03-01" \
              --headers "Content-Type=application/json" \
              --body @containerapp-kafka-patch.json \
              --output none

            rm -f containerapp-kafka-patch.json

      - name: Verify deployed health endpoint
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            fqdn=$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query 'properties.configuration.ingress.fqdn' \
              --output tsv)
            test -n "$fqdn"
            echo "PURCHASING_API_URL=https://$fqdn" >> "$GITHUB_ENV"
            curl --fail --retry 12 --retry-all-errors --retry-delay 10 "https://$fqdn/health"

            app_json=$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --output json)

            jq -e '.properties.template.containers[] | select(.name == "medzo-kafka" and .image == "docker.io/apache/kafka:3.9.0")' <<< "$app_json" >/dev/null
            jq -e '.properties.template.containers[] | select(.name == "medzo-purchasing-service").env[] | select(.name == "Kafka__Enabled" and .value == "true")' <<< "$app_json" >/dev/null
            jq -e '.properties.template.containers[] | select(.name == "medzo-purchasing-service").env[] | select(.name == "Kafka__BootstrapServers" and .value == "localhost:9092")' <<< "$app_json" >/dev/null
